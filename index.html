<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>大学コード検索</title>

<style>

body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
}

h1{
    color:#003366;
}

#searchBox{
    width:100%;
    padding:12px;
    font-size:18px;
    box-sizing:border-box;
}

#status{
    margin-top:15px;
    margin-bottom:15px;
    color:#666;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003366;
    color:white;
    text-align:left;
    padding:10px;
}

td{
    border-bottom:1px solid #ddd;
    padding:8px;
    vertical-align:top;
}

tr:hover{
    background:#f5f5f5;
}

.code{
    font-family:Consolas,monospace;
    font-weight:bold;
    white-space:nowrap;
}

.error{
    color:red;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>大学コード検索</h1>

<p>
大学名・学部名・学科名・略称・コード番号を入力してください。<br>
複数語をスペースで区切るとAND検索になります。
</p>

<input
    id="searchBox"
    type="text"
    placeholder="例：千葉 教育">

<div id="status">
データ読込中...
</div>

<table>
    <thead>
        <tr>
            <th style="width:180px;">コード</th>
            <th>大学・学部・学科</th>
        </tr>
    </thead>

    <tbody id="results"></tbody>
</table>

<script>

const MAX_DISPLAY = 100;

let data = [];

/* CSV読込 */

async function loadCSV() {

    try {

        const response = await fetch("univcode.csv");

        if (!response.ok) {
            throw new Error("CSV読込失敗");
        }

        const buffer = await response.arrayBuffer();

        let text = new TextDecoder("utf-8").decode(buffer);

        /* UTF-8 BOM除去 */
        text = text.replace(/^\uFEFF/, "");

        const lines = text.trim().split(/\r?\n/);

        data = [];

        for (let i = 1; i < lines.length; i++) {

            const parts = parseCsvLine(lines[i]);

            if (parts.length < 3) continue;

            const rec = {
                code10: parts[0],
                univtxt: parts[1],
                univsearch: parts[2]
            };

            rec.searchText =
                (
                    rec.code10 + " " +
                    rec.univtxt + " " +
                    rec.univsearch
                ).toLowerCase();

            data.push(rec);
        }

        document.getElementById("status").textContent =
            `${data.length.toLocaleString()}件読み込みました。検索語を入力してください。`;

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            '<span class="error">univcode.csv を読み込めませんでした。</span>';
    }
}

/* CSV1行解析 */

function parseCsvLine(line) {

    const result = [];
    let current = "";
    let inQuote = false;

    for (let i = 0; i < line.length; i++) {

        const ch = line[i];

        if (ch === '"') {
            inQuote = !inQuote;
            continue;
        }

        if (ch === "," && !inQuote) {
            result.push(current.trim());
            current = "";
        } else {
            current += ch;
        }
    }

    result.push(current.trim());

    return result;
}

/* 検索 */

function search() {

    const q =
        document
        .getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();

    if (q.length < 2) {

        document.getElementById("results").innerHTML = "";

        document.getElementById("status").textContent =
            `${data.length.toLocaleString()}件登録されています。`;

        return;
    }

    const keywords = q.split(/\s+/);

    let hitCount = 0;

    let html = "";

    for (const row of data) {

        let matched = true;

        for (const keyword of keywords) {

            if (!row.searchText.includes(keyword)) {

                matched = false;
                break;
            }
        }

        if (!matched) continue;

        hitCount++;

        if (hitCount <= MAX_DISPLAY) {

            html += `
            <tr>
                <td class="code">${escapeHtml(row.code10)}</td>
                <td>${escapeHtml(row.univtxt)}</td>
            </tr>
            `;
        }
    }

    document.getElementById("results").innerHTML = html;

    document.getElementById("status").textContent =
        `${hitCount.toLocaleString()}件ヒット（表示は先頭 ${MAX_DISPLAY} 件まで）`;
}

/* HTMLエスケープ */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

/* イベント */

document
    .getElementById("searchBox")
