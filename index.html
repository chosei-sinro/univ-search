<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>大学・学部検索</title>

<style>

body {
    font-family: "Yu Gothic", sans-serif;
    max-width: 1200px;
    margin: 20px auto;
    padding: 20px;
    background-color: #f8f9fa;
}

h1 {
    color: #003366;
}

#searchBox {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

#count {
    margin-top: 15px;
    color: #555;
    font-weight: bold;
}

table {
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
    background: white;
}

th {
    background: #003366;
    color: white;
    padding: 10px;
}

td {
    border-bottom: 1px solid #ddd;
    padding: 8px;
}

tr:hover {
    background: #f0f8ff;
}

.code {
    font-family: monospace;
    white-space: nowrap;
}

.loading {
    color: blue;
}

.error {
    color: red;
}

</style>
</head>

<body>

<h1>大学・学部検索</h1>

<p>
大学名・学部名・学科名・番号の一部を入力してください。<br>
複数語をスペースで区切るとAND検索になります。
</p>

<input
    type="text"
    id="searchBox"
    placeholder="例：岩見沢 美術">

<div id="count" class="loading">
データ読込中...
</div>

<table>
    <thead>
        <tr>
            <th style="width:180px;">番号</th>
            <th>大学・学部・学科</th>
        </tr>
    </thead>
    <tbody id="results">
    </tbody>
</table>

<script>

            throw new Error("CSV読込失敗");
        }

        display(masterData);
