<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>大学コード検索</title>

<style>

body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    margin:20px auto;
    max-width:1200px;
    padding:20px;
}

h1{
    color:#003366;
}

#searchBox{
    width:100%;
    padding:12px;
    font-size:18px;
    box-sizing:border-box;
}

#status{
    margin-top:15px;
    color:#666;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#003366;
    color:#fff;
    text-align:left;
    padding:10px;
}

td{
    border-bottom:1px solid #ddd;
    padding:8px;
}

.code{
    font-family:monospace;
    font-weight:bold;
    white-space:nowrap;
}

.highlight{
    background:yellow;
    font-weight:bold;
}

</style>
</head>
<body>

<h1>大学コード検索</h1>

<p>
大学名・学部名・学科名・コード番号を入力してください。<br>
複数語はスペース区切りでAND検索します。
</p>

<input
    id="searchBox"
    type="text"
    placeholder="例：千葉 教育">

<div id="status">
読み込み中...
</div>

<table>
<thead>
<tr>
    <th style="width:180px;">コード</th>
    <th>大学・学部・学科</th>
</tr>
</thead>

<tbody id="results"></tbody>

</table>

<script>

const MAX_DISPLAY = 100;

let data = [];


console.log("ページ起動");

fetch("univcode.csv")
  .then(r => {
      console.log("status=", r.status);
      return r.text();
  })
  .then(t => {
      console.log("文字数=", t.length);
  })
  .catch(e => {
      console.error(e);
  });



async function loadCSV(){

    const start = performance.now();

    try{

    console.log("CSV読込開始");
    const response = await fetch("univcode.csv");
    console.log("fetch完了");
    const text = await response.text();
    console.log("読込文字数=", text.length);

        let text =
          new TextDecoder("utf-8")
          .decode(buffer);

        text = text.replace(/^\uFEFF/, "");

        const lines =
            text.trim().split(/\r?\n/);

        data = [];

        for(let i=1;i<lines.length;i++){

            const line = lines[i];

            const parts = parseLine(line);

            if(parts.length < 3) continue;

            const rec = {
                code10: parts[0],
                univtxt: parts[1],
                univsearch: parts[2]
            };

            rec.searchText =
                (
                    rec.code10 + " " +
                    rec.univtxt + " " +
                    rec.univsearch
                ).toLowerCase();

            data.push(rec);
        }

        const sec =
            ((performance.now()-start)/1000)
            .toFixed(1);

        document.getElementById("status")
            .textContent =
            `${data.length.toLocaleString()}件読込完了 (${sec}秒) 。検索してください。`;

    }
    catch(err){

        document.getElementById("status")
          .textContent =
          "CSV読込エラー";

        console.error(err);
    }
}

function parseLine(line){

    const result=[];
    let current="";
    let inQuote=false;

    for(let i=0;i<line.length;i++){

        const ch=line[i];

        if(ch === '"'){
            inQuote=!inQuote;
            continue;
        }

        if(ch === "," && !inQuote){
            result.push(current.trim());
            current="";
        }
        else{
            current+=ch;
        }
    }

    result.push(current.trim());

    return result;
}

function escapeHtml(str){

    return str
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
}

function search(){

    const q =
        document
        .getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();

    if(q.length < 3){

        document.getElementById("results")
            .innerHTML = "";

        document.getElementById("status")
            .textContent =
            `${data.length.toLocaleString()}件登録されています。`;

        return;
    }

    const keywords = q.split(/\s+/);

    let hitCount = 0;

    let html = "";

    for(const row of data){

        let ok = true;

        for(const k of keywords){

            if(!row.searchText.includes(k)){

                ok = false;

                break;
            }
        }

        if(!ok) continue;

        hitCount++;

        if(hitCount <= MAX_DISPLAY){

            html += `
            <tr>
                <td class="code">
                    ${escapeHtml(row.code10)}
                </td>
                <td>
                    ${escapeHtml(row.univtxt)}
                </td>
            </tr>`;
        }
    }

    document.getElementById("results")
      .innerHTML = html;

    document.getElementById("status")
      .textContent =
      `${hitCount.toLocaleString()}件ヒット（表示は先頭${MAX_DISPLAY}件まで）`;
}

document
  .getElementById("searchBox")
  .addEventListener("input", search);

loadCSV();

</script>

</body>
</html>
