<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学コード検索</title>

<style>
body{
    font-family: "Yu Gothic", sans-serif;
    max-width: 1200px;
    margin: 20px auto;
    padding: 20px;
}

h1{
    color: #003366;
}

#searchBox{
    width: 100%;
    padding: 12px;
    font-size: 16px;
    box-sizing: border-box;
}

#count{
    margin-top: 15px;
    margin-bottom: 10px;
    color: #666;
}

table{
    width: 100%;
    border-collapse: collapse;
}

th{
    background: #003366;
    color: white;
    padding: 10px;
    text-align: left;
}

td{
    border-bottom: 1px solid #ddd;
    padding: 8px;
}

tr:hover{
    background-color: #f5f5f5;
}

.code{
    font-family: monospace;
    font-weight: bold;
}

.error{
    color: red;
}
</style>
</head>

<body>

<h1>大学コード検索</h1>

<p>
大学名・学部名・学科名・コード番号の一部を入力してください。<br>
複数語をスペース区切りで入力するとAND検索できます。
</p>

<input
    id="searchBox"
    type="text"
    placeholder="例：千葉　教育">

<div id="count">読み込み中...</div>

<table>
    <thead>
        <tr>
            <th style="width:180px">コード</th>
            <th>大学・学部・学科</th>
        </tr>
    </thead>
    <tbody id="results"></tbody>
</table>

<script>

let data = [];

// CSV読込
async function loadCSV() {

    try {

        const response = await fetch("univcode.csv");

        if (!response.ok) {
            throw new Error("CSVの読込に失敗しました");
        }

        const csvText = await response.text();

        parseCSV(csvText);

        display(data);

    } catch(error) {

        document.getElementById("count").innerHTML =
            '<span class="error">univcode.csv を読み込めません。</span>';

        console.error(error);
    }
}

// CSV解析
function parseCSV(csvText) {

    const lines = csvText.trim().split(/\r?\n/);

    if(lines.length <= 1) return;

    const headers = lines[0].split(",");

    const codeIndex = headers.indexOf("code10");
    const textIndex = headers.indexOf("univtxt");

    data = [];

    for(let i = 1; i < lines.length; i++) {

        const line = lines[i];

        const commaPos = line.indexOf(",");

        if(commaPos === -1) continue;

        const code10 = line.substring(0, commaPos).trim();

        const univtxt = line
            .substring(commaPos + 1)
            .replace(/^"/, "")
            .replace(/"$/, "");

        data.push({
            code10: code10,
            univtxt: univtxt
        });
    }
}

// 表示
function display(rows) {

    document.getElementById("count").textContent =
        rows.length.toLocaleString() + " 件";

    document.getElementById("results").innerHTML =
        rows.map(row => `
            <tr>
                <td class="code">${escapeHtml(row.code10)}</td>
                <td>${escapeHtml(row.univtxt)}</td>
            </tr>
        `).join("");
}

// 検索
function search() {

    const query =
        document.getElementById("searchBox")
        .value
        .trim()
        .toLowerCase();

    if(query === "") {
        display(data);
        return;
    }

    const keywords = query.split(/\s+/);

    const result = data.filter(row => {

        const target =
            (row.code10 + " " + row.univtxt)
            .toLowerCase();

        return keywords.every(keyword =>
            target.includes(keyword)
        );

    });

    display(result);
}

// HTMLエスケープ
function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

document
    .getElementById("searchBox")
    .addEventListener("input", search);

loadCSV();

</script>

</body>
</html>
